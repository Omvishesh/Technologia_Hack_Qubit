name: VM Connection Test

on:
  push:
    branches:
      - 'saket/backend-api'
  workflow_dispatch:

jobs:
  test-vm:
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH connection to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/github_actions
          chmod 600 ~/.ssh/github_actions

          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/github_actions \
            "$VM_USER@$VM_HOST" \
            "echo 'GitHub Actions connected successfully to HackQubit VM'; hostname; whoami"

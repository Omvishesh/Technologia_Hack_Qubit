<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot UI (v2)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="script.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white rounded-lg shadow-lg w-full max-w-xl flex flex-col h-[80vh]">
    <header class="bg-indigo-600 text-white p-4 rounded-t-lg">
      <h1 class="text-lg font-semibold">Chatbot (v2)</h1>
    </header>
    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-3">
      <!-- Messages will be injected here -->
    </main>
    <footer class="p-4 border-t">
      <form id="chatForm" class="flex gap-2">
        <input type="text" id="messageInput" placeholder="Type a message..." required class="flex-1 border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">Send</button>
      </form>
    </footer>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus AI Assistant</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%233d6fd0' stroke-width='7'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button class="menu-btn" id="menu-btn" type="button" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
        </button>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" id="nav-chat" type="button" title="Chat">
          <svg viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
          <span class="nav-label">Chat</span>
        </button>
        <button class="nav-item" id="nav-new" type="button" title="New chat">
          <svg viewBox="0 0 24 24"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>
          <span class="nav-label">New chat</span>
        </button>
        <a class="nav-item" id="nav-docs" href="http://localhost:8000/docs" target="_blank" rel="noopener" title="API docs">
          <svg viewBox="0 0 24 24"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>
          <span class="nav-label">API docs</span>
        </a>
        <button class="nav-item" id="nav-settings" type="button" title="Settings">
          <svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          <span class="nav-label">Settings</span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <div class="status-box" id="status-box" title="Checking backend…">
          <span class="status-dot" id="status-dot"></span>
          <span class="nav-label" id="status-label">Checking…</span>
        </div>
      </div>
    </aside>

    <!-- Main chat area -->
    <main class="main empty" id="main">
      <div class="chat-scroll" id="chat-scroll">
        <section class="hero" id="hero">
          <div class="logo-ring" aria-hidden="true"></div>
          <h1 class="hero-title">Campus Assistant <span class="beta-pill">BETA</span></h1>
          <p class="hero-sub">AI-Powered Student Data Advisor</p>
          <p class="hero-desc">Hi! I'm your Campus assistant. Ask about students, CGPAs, departments, skills or placements, and I'll query the student database and explain the results.</p>
        </section>

        <div class="messages" id="messages"></div>

        <div class="typing" id="typing" hidden>
          <span class="mini-ring" aria-hidden="true"></span>
          <span class="dots"><i></i><i></i><i></i></span>
        </div>
      </div>

      <form class="composer" id="chat-form" autocomplete="off">
        <textarea id="user-input" rows="1" placeholder="Ask about student records, CGPA or placements..."></textarea>
        <div class="composer-bar">
          <button type="submit" class="send-btn" id="send-btn" aria-label="Send" disabled>
            <svg viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
          </button>
        </div>
      </form>
    </main>
  </div>

  <!-- Settings -->
  <div class="modal-overlay" id="config-modal" hidden>
    <div class="modal">
      <h2 class="modal-title">Settings</h2>
      <label class="field">
        <span>Mode</span>
        <select id="config-mode">
          <option value="live">Live — connect to the backend API</option>
          <option value="demo">Demo — offline mock data</option>
        </select>
      </label>
      <label class="field">
        <span>Backend URL</span>
        <input type="text" id="config-backend-url" placeholder="http://localhost:8000">
      </label>
      <label class="field">
        <span>Health check interval (seconds)</span>
        <input type="number" id="config-poll-interval" min="2" max="60">
      </label>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="config-cancel">Cancel</button>
        <button type="button" class="btn btn-primary" id="config-save">Save</button>
      </div>
    </div>
  </div>

  <script src="js/mockData.js"></script>
  <script src="js/app.js" defer></script>
</body>
</html>
